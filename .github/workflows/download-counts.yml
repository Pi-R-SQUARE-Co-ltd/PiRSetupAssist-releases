name: Update download cards

# การ์ดใน badges/ เป็นภาพนิ่ง ตัวเลขจึงต้องมีคนวาดใหม่ให้
# รอบทุก 6 ชั่วโมงพอ เพราะยอดดาวน์โหลดไม่ใช่ของที่ต้องเห็นทันที
# และกดรันเองได้จากแท็บ Actions เมื่ออยากให้ตรงเดี๋ยวนั้น
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: download-counts
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # **ต้อง checkout main ตรง ๆ ห้ามปล่อยค่าปริยาย**
      #
      # ตอนถูกกระตุ้นด้วย event ของ release ค่าปริยายคือ checkout ที่ tag ของรุ่นนั้น
      # ซึ่งได้ HEAD แบบ detached · ขั้น push ท้ายงานจึงตกด้วย
      # `fatal: You are not currently on a branch.` ทุกครั้งที่ปล่อยรุ่นหรือแก้หน้า release
      # แล้ว GitHub ส่งอีเมลว่างานพังทุกครั้ง ทั้งที่การ์ดวาดเสร็จแล้วจริง
      # (เจอ 3 ครั้งรวดตอนปล่อย v1.3.0 · 4 ก.ย. 2569)
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Render cards from the latest counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/render-download-cards.py

      # commit เฉพาะตอนตัวเลขขยับจริง ไม่งั้นจะมี commit เปล่าทุก 6 ชั่วโมง
      - name: Commit if the numbers moved
        run: |
          if [ -z "$(git status --porcelain badges)" ]; then
            echo "counts unchanged, nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          git commit -m "Update download counts"
          git push
